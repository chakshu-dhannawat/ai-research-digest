services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: newsletter
      POSTGRES_PASSWORD: newsletter
      POSTGRES_DB: newsletter
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsletter"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: always
    ports:
      - "8585:8585"
    env_file: ./backend/.env
    environment:
      # Proxy settings are read from .env. Empty values are fine for environments
      # without a corporate proxy.
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db}
      no_proxy: ${no_proxy:-localhost,127.0.0.1,db}
    volumes:
      - ./dryrun_output:/app/dryrun_output
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3737:3737"
    depends_on:
      - backend

volumes:
  pgdata:
